  canvas.addEventListener('pointermove', e => {
    const [px, py] = rel(e);
    if (last) {
      moved += Math.abs(px - last[0]) + Math.abs(py - last[1]);
      if (drag) { [drag.x, drag.y] = toWorld(px, py); alpha = Math.max(alpha, 0.35); }
      else { view.x += px - last[0]; view.y += py - last[1]; panned = true; }
      last = [px, py];
    } else canvas.style.cursor = pick(px, py) ? 'pointer' : 'grab';
  });
  canvas.addEventListener('pointerup', e => {
    if (last && moved < 6 && !panned) { const n = pick(...rel(e)); hot = n || null; show(n); }
    drag = null; last = null;
  });
  canvas.addEventListener('pointerleave', () => { last = null; drag = null; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    view.k = Math.min(2.5, Math.max(0.4, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  }, { passive: false });
  function show(n) {
    if (!n) {
      detail.innerHTML = '<div class="tt">Граф проекта</div>'
        + '<div class="row"><span class="k">тяни узлы, крути колесо, жми на точки</span></div>';
      return;
    }
    if (n.type === 'milestone') {
      const m = n.m;
      const curMs = p.milestones.find(x => x.status === 'current');
      const linked = p.tasks.filter(t => (t.ref || (curMs ? curMs.id : '')) === m.id);
      detail.innerHTML = '<div class="tt" style="color:' + esc(color) + '">' + esc(m.title) + '</div>'
        + '<div class="row"><span class="k">Статус</span><span class="v">' + esc((RM_TAG[m.status] || ['', m.status])[1]) + '</span></div>'
        + (m.date ? '<div class="row"><span class="k">Дата</span><span class="v">' + esc(m.date) + '</span></div>' : '')
        + (m.desc ? '<div class="row"><span class="k"></span><span class="v">' + esc(m.desc) + '</span></div>' : '')
        + ((m.people || []).length ? '<div class="row"><span class="k">Участники</span><span class="v">' + esc(m.people.join(', ')) + '</span></div>' : '')
        + '<div class="row"><span class="k">связанных задач</span><span class="v">' + linked.length + '</span></div>';
    } else if (n.type === 'task') {
      detail.innerHTML = '<div class="tt">' + esc(n.t.title) + '</div>'
        + '<div class="row"><span class="k">Статус</span><span class="v">' + esc(n.t.status || '') + '</span></div>'
        + '<div class="row"><span class="k">Исполнитель</span><span class="v">' + esc(asgList(n.t.assignee).join(', ') || '—') + '</span></div>'
        + (n.t.priority ? '<div class="row"><span class="k">Приоритет</span><span class="v">P' + esc(n.t.priority) + '</span></div>' : '');
    } else {
      const own = p.tasks.filter(t => asgList(t.assignee).includes(n.label));
      detail.innerHTML = '<div class="tt">' + esc(n.label) + '</div>'
        + '<div class="row"><span class="k">задач в работе</span><span class="v">' + own.length + '</span></div>'
        + own.map(t => '<div class="trow">' + esc(t.title) + '</div>').join('');
    }
  }
  show(null);
}

function project(slug) {
  const p = RM.projects.find(x => x.slug === slug);
  if (!p) { location.hash = ''; return; }
  const cur = p.milestones.find(m => m.status === 'current');
  const nxt = p.milestones.find(m => m.status === 'plan');
  const done = p.milestones.filter(m => m.status === 'done').length;
  const pct = p.milestones.length ? Math.round(100 * done / p.milestones.length) : 0;
  const track = p.milestones.map(m => {
    const st = RM_TAG[m.status] || ['plan', m.status];
    const node = m.status === 'done' ? '✓' : (m.status === 'current' ? '●' : String(p.milestones.indexOf(m) + 1));
    const when = m.date ? '<b>' + esc(m.date) + '</b>' + (m.status === 'plan' ? 'план' : (m.status === 'current' ? 'в работе' : 'завершено')) : '<b>—</b>';
    return '<div class="mile ' + m.status + '"><div class="when">' + when + '</div>'
      + '<div class="axis"><div class="node">' + node + '</div></div>'
      + '<div class="body"><div class="t">' + esc(m.title) + '<span class="tag ' + st[0] + '">' + st[1] + '</span></div>'
      + (m.desc ? '<div class="d">' + esc(m.desc) + '</div>' : '') + people(m.people) + '</div></div>';
  }).join('');
  const tasks = p.tasks.map(t =>
    '<div class="kb-card">' + esc(t.title)
    + '<div class="meta">'
    + (asgList(t.assignee).length ? '<span>' + esc(asgList(t.assignee).join(', ')) + '</span>' : '')
    + (t.priority ? '<span>P' + esc(t.priority) + '</span>' : '')
    + (t.ref ? '<span>→ ' + esc(t.ref) + '</span>' : '') + '</div></div>').join('')
    || '<div class="ph">открытых задач нет</div>';
  el().innerHTML = '<div class="card" style="--pc:' + esc(p.color) + ';cursor:default">'
    + '<button class="tbtn" id="back">← Все проекты</button>'
    + (p.slug === 'syrok' ? '<button class="tbtn" id="hist" style="margin-left:8px">Хронология Сырка →</button>' : '')
    + '<div class="head" style="margin-top:12px"><div class="ava" style="background:' + esc(p.color) + '">' + esc(p.letter) + '</div>'
    + '<div><div class="nm" style="font-size:16px">' + esc(p.name) + badge(p) + '</div><div class="ph">' + esc(p.desc) + '</div></div>'
    + donut(p.color, pct) + '</div>'
    + mrow(p)
    + '<div class="next">сейчас: <b>' + esc(cur ? cur.title : '—') + '</b> → дальше <b>' + esc(nxt ? nxt.title : '—') + '</b></div>'
    + spark(p.color, p.activity) + '</div>'
    + '<h2 class="sec">Ключевые точки</h2><div class="track">' + track + '</div>'
    + '<h2 class="sec">Граф проекта — тяни узлы, крути колесом, жми</h2>'
    + '<div class="gwrap"><canvas id="gr"></canvas><div class="gdetail" id="gd"></div></div>'
    + '<h2 class="sec">Открытые задачи (' + p.tasks.length + ')</h2><div class="tgrid">' + tasks + '</div>';
  document.getElementById('back').onclick = () => { location.hash = ''; };
  const hb = document.getElementById('hist');
  if (hb) hb.onclick = () => { location.href = 'history.html'; };
  graph(document.getElementById('gr'), document.getElementById('gd'), p);
}

const el = () => document.getElementById('app');
function render() {
  const m = location.hash.match(/^#\/p\/([a-z0-9\-]{1,40})/);
  if (m) project(m[1]); else overview();
}
window.addEventListener('hashchange', render);
render();
</script></body></html>
